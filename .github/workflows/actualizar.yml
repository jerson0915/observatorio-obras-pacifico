# Actualiza los datos de SECOP y publica el dashboard una vez por semana.
name: Actualizar dashboard

on:
  schedule:
    - cron: "0 11 * * 1"     # cada lunes, 6:00 a. m. hora de Colombia (11:00 UTC)
  workflow_dispatch:          # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]          # si cambias algo a mano, solo se vuelve a publicar

permissions:
  contents: write             # guardar los datos nuevos en el repositorio
  pages: write                # publicar en GitHub Pages
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      # Población DANE, límites e imágenes satelitales: se descargan una vez y se reutilizan
      - uses: actions/cache@v4
        if: github.event_name != 'push'
        with:
          path: datos/cache
          key: descargas-v1

      - name: Instalar librerías
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Ejecutar los notebooks
        if: github.event_name != 'push'
        run: |
          for nb in 01_extraccion.ipynb 02_limpieza.ipynb 03_dashboard.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 "$nb"
            echo "::endgroup::"
          done

      - name: Guardar los datos nuevos
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hubo cambios."
          else
            git commit -m "Actualización automática $(TZ=America/Bogota date +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: publicar
        uses: actions/deploy-pages@v4
